<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纯稚学知识图谱 · 春知网文献计量</title>
<meta name="description" content="以春知网「纯稚」CP 同人写作为样本的文献计量式知识图谱：913 个节点、1298 条引用关系，含发展历程、引文总览、语料总览与研究空白四个视图。">
<meta name="theme-color" content="#0d1015">
<meta property="og:type" content="website">
<meta property="og:title" content="纯稚学知识图谱 · 春知网文献计量">
<meta property="og:description" content="913 个节点、1298 条关系的引文网络：发展历程、引文总览、语料总览、研究空白四视图。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1015'/%3E%3Ccircle cx='16' cy='16' r='4.4' fill='%23f0b664'/%3E%3Ccircle cx='8' cy='9' r='2.2' fill='%235ec5a5'/%3E%3Ccircle cx='24' cy='9' r='2.2' fill='%238fb3e8'/%3E%3Ccircle cx='8' cy='24' r='2.2' fill='%23e879a0'/%3E%3Ccircle cx='24' cy='24' r='2.2' fill='%23ff8a5b'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d1015; --panel:#151a21; --panel2:#1b212a; --line:#2b3442;
  --text:#eef3fa; --muted:#9dabc0; --dim:#75859b;
  --amber:#f0b664; --teal:#5ec5a5; --pink:#e879a0;
  --coral:#ff8a5b; --blue:#8fb3e8;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:13.5px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font-family:inherit}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.serif{font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif}

/* 整页滚动：页头吸顶，左右栏随页面一起滚动 */
#app{display:flex;flex-direction:column;min-height:100vh;position:relative}
#topbar{position:sticky;top:0;z-index:40}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.06em;white-space:nowrap}
.brand .en{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.hnav{margin-left:auto;display:flex;gap:16px;font-size:12px;white-space:nowrap}
.hnav a{cursor:pointer;color:var(--muted)}
.hnav a:hover{color:var(--amber);text-decoration:none}

#toolbar{display:flex;align-items:center;gap:8px;padding:9px 20px;border-bottom:1px solid var(--line);background:#11161d;flex:none;flex-wrap:wrap;position:relative}
.tabs{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:8px;border:1px solid var(--line)}
.tab{padding:5px 13px;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:12px}
.tab.on{background:#33425a;color:#fff;font-weight:600}
.tab:hover{color:var(--text)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.search{position:relative;display:flex;align-items:center;margin-left:auto}
.icon-btn{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;padding:0;background:var(--panel2);border:1px solid var(--line);border-radius:50%;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.icon-btn:hover{color:var(--amber);border-color:var(--amber)}
.icon-btn svg{width:13px;height:13px;display:block}
/* 搜索：点放大镜浮出一条固定定位的检索条；回车或再点放大镜，结果进右栏 */
#sbox{position:fixed;top:calc(var(--topH,104px) + 10px);left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 28px));z-index:80;display:none;align-items:center;gap:9px;padding:9px 10px 9px 13px;background:#1a212b;border:1px solid #3d4959;border-radius:10px;box-shadow:0 16px 44px rgba(0,0,0,.62)}
#sbox.on{display:flex}
#sbox .sico{width:14px;height:14px;flex:none;color:var(--dim)}
#sbox input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font-size:13px;padding:2px 0}
#sbox input::placeholder{color:#66748a}
#sbox .skey{flex:none;font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:2px 6px;letter-spacing:.02em}
#sbox .sx{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--dim);font-size:15px;line-height:1;cursor:pointer;border-radius:50%}
#sbox .sx:hover{color:var(--text);background:#232c39}
.icon-btn.on{color:var(--amber);border-color:var(--amber);background:#232c39}
/* 检索结果：右栏 */
.sres-n{font-size:11.5px;color:var(--muted);line-height:1.75;margin:2px 0 10px}
.sres-n b{color:var(--amber);font-weight:600}
.sres .item{display:block}
.sres .item .sub{display:flex;gap:6px;align-items:center}
.sres .item .dot{width:6px;height:6px;border-radius:50%;flex:none}
.sres .snip{font-size:10.5px;color:#8593a5;line-height:1.65;margin-top:4px}
.sres em.hl{font-style:normal;color:var(--amber);background:rgba(255,171,46,.14);border-radius:3px;padding:0 1px}
.sback{width:100%;text-align:left;font-size:11px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 9px;margin-bottom:12px;cursor:pointer}
.sback:hover{color:var(--amber);border-color:var(--amber)}
.layers{display:flex;gap:5px;flex-wrap:wrap}
.lay{padding:4px 9px;border:1px solid transparent;border-radius:20px;background:rgba(13,16,21,.5);color:var(--dim);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:color .3s,background .3s,border-color .3s,box-shadow .3s}
.lay i{width:8px;height:8px;border-radius:50%;display:inline-block;transition:filter .3s,opacity .3s,box-shadow .3s}
.lay:not(.on) i{filter:grayscale(.85) brightness(.4);opacity:.45}
.lay.on{color:#fff;background:#26324a;border-color:#44567c;font-weight:500;box-shadow:0 0 0 1px rgba(120,150,200,.12)}
.lay.on i{box-shadow:0 0 0 2px rgba(255,255,255,.14)}
.lay:hover{color:var(--text)}
/* 关系图例：点按弹出，不常驻画布 */
.popbtn{position:absolute;left:16px;z-index:7;padding:4px 11px;border:1px solid #2f3945;border-radius:8px;background:rgba(20,26,34,.94);color:#93a1b3;font-size:11px;line-height:1.5;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.45);display:none}
.popbtn:hover{color:var(--text);border-color:#43505f}
.popbtn.on{color:var(--text);border-color:#4a5766;background:#212a36}
#legendBtn{bottom:14px}
/* 图层图例悬在播放条上方：bottom = 条底边 14px + 条高(--tlh) + 22px 净空，左边缘与播放条对齐 */
#ringBtn{bottom:calc(var(--tlh,66px) + 36px)}
.pop{position:absolute;left:16px;background:#1a212b;border:1px solid var(--line);border-radius:10px;padding:10px 13px 8px;display:none;z-index:46;box-shadow:0 10px 28px rgba(0,0,0,.55);min-width:316px;max-width:min(316px,90vw)}
.pop.on{display:block}
#relPop{bottom:50px}
/* 弹层贴着浮标上沿展开，同样避开播放条 */
#ringPop{bottom:calc(var(--tlh,66px) + 72px)}
.pop .rh{font-size:10.5px;color:var(--dim);letter-spacing:.06em;margin-bottom:4px}
.pop .rrow{display:grid;grid-template-columns:22px 34px 1fr;align-items:center;column-gap:8px;padding:4px 0;font-size:11.5px;color:var(--muted);border-bottom:1px solid #202833}
.pop .rrow:last-child{border-bottom:0}
.pop .rrow i{width:16px;height:0;border-top:2px solid;flex:none;position:relative}
.pop .rrow i:after{content:"";position:absolute;right:-1px;top:-4px;border:3px solid transparent;border-left-color:currentColor}
.pop .rrow i.nodir:after{display:none}
.pop .rrow i.ring{width:13px;height:13px;border:1.5px solid currentColor;border-radius:50%;opacity:.85}
.pop .rrow i.ring:after{content:"";position:absolute;left:50%;top:50%;right:auto;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border:0;border-radius:50%;background:currentColor}
.pop .rrow i.ring.big{opacity:1}
.pop .rrow i.ring.faint{opacity:.5}
#ringPop .rrow{grid-template-columns:22px 106px 1fr}
.pop .rrow b{color:var(--text);font-weight:500}
.pop .rrow span{color:var(--dim);font-size:10.5px}
/* 节点详情里的关系构成 */
.relrow{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px}
.reltag{font-size:10px;padding:1px 7px;border:1px solid;border-radius:10px;line-height:1.6}
.tool-btn{padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}
.tool-btn:hover{color:var(--text);border-color:var(--muted)}
.tool-btn.on{color:var(--text);border-color:#42557a;background:#26324a}
.tool-btn.tab{font-size:12px;padding:5px 12px}
.tool-btn.tab.on{background:#33425a;color:#fff;border-color:#33425a}

main{display:flex;align-items:stretch}
#side{width:222px;flex:none;border-right:1px solid var(--line);background:var(--panel);padding:14px}
#side h3{font-size:11px;color:var(--dim);font-weight:500;letter-spacing:.1em;margin:0 0 10px;text-transform:uppercase}
.side-sec{margin-bottom:22px}
.chip{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--muted)}
.chip:hover{background:var(--panel2);color:var(--text)}
.chip.on{background:#26324a;color:var(--text)}
.chip i{width:8px;height:8px;border-radius:2px;flex:none}
.chip .n{margin-left:auto;font-size:11px;color:var(--dim)}
.bar{height:4px;background:#222a35;border-radius:2px;margin-top:4px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:2px}
.rank{padding:5px 0;border-bottom:1px solid #202833;cursor:pointer}
.rank:hover .rk-t{color:var(--amber)}
.rk-t{font-size:12px;color:var(--text);display:flex;gap:8px}
.rk-t b{font-weight:400;color:var(--dim);font-size:11px;min-width:20px}
.rk-s{font-size:11px;color:var(--dim);padding-left:28px}

#stage{flex:1;min-width:0;position:relative;height:calc(100vh - var(--topH,104px) - 34px);min-height:540px;background:radial-gradient(circle at 50% 45%,#131a23 0%,#0d1015 72%)}
#stage.gapmode{height:auto;min-height:0}
#cv{display:block;width:100%;height:100%;cursor:grab}
#cv.drag{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:#1c2430;border:1px solid #3a4553;border-radius:8px;padding:8px 11px;font-size:12px;max-width:290px;box-shadow:0 4px 16px rgba(0,0,0,.45);display:none;z-index:8;line-height:1.5}
#tip .tt{font-weight:500;color:var(--text)}
#tip .ts{color:var(--muted);font-size:11px;margin-top:3px}
#tip .trs{margin-top:6px;padding-top:6px;border-top:1px solid #303a48;font-size:11px;color:var(--muted)}
#tip .trs .rc{display:inline-block;font-size:10.5px;padding:0 6px;border:1px solid;border-radius:9px;margin:3px 4px 0 0;line-height:1.7}
#tip .trs .tp{display:block;color:var(--dim);font-size:10px;margin-top:3px}
#tip .trs.dim{color:var(--dim)}
#hint{position:absolute;right:14px;bottom:14px;font-size:11px;color:var(--dim);pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;pointer-events:none}

#detail{width:320px;flex:none;border-left:1px solid var(--line);background:var(--panel);padding:16px}
#detail h2{font-size:15px;font-weight:500;line-height:1.5;margin:0 0 6px}
.kind{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-bottom:12px}
.kv{display:flex;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px solid #202833}
.kv .k{color:var(--dim);width:64px;flex:none}
.kv .v{color:var(--text);word-break:break-all}
.sec-t{font-size:11px;color:var(--dim);letter-spacing:.08em;margin:18px 0 8px;text-transform:uppercase}
.abs{font-size:12px;color:var(--muted);line-height:1.7;background:var(--panel2);padding:10px;border-radius:7px;border-left:2px solid var(--amber)}
.abs.gloss{font-size:12.5px;line-height:1.85;color:#dfe7f2;padding:11px 12px}
.item{padding:7px 9px;background:var(--panel2);border-radius:6px;margin-bottom:5px;font-size:12px;cursor:pointer;border:1px solid transparent}
.item:hover{border-color:var(--line);color:var(--amber)}
.item .sub{font-size:11px;color:var(--dim);margin-top:2px}
.tagx{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;background:#232c38;color:var(--muted);margin:0 4px 4px 0;cursor:pointer}
.tagx:hover{color:var(--amber)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.btnrow a,.btnrow button{font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--blue);cursor:pointer}
.empty{color:var(--dim);font-size:12px;padding:14px 0}

table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
thead th{position:sticky;top:var(--topH,98px);background:var(--bg);text-align:left;color:var(--dim);font-weight:400;padding:9px 8px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.04em;z-index:1}
tbody td{padding:9px 8px;border-bottom:1px solid #1d242e;vertical-align:top;word-break:break-word}
tbody tr:hover{background:#161c25}
footer{flex:none;margin-top:auto;border-top:1px solid var(--line);background:#11161d;padding:7px 20px;font-size:11px;color:var(--dim);text-align:center;line-height:1.75}
footer b{color:var(--muted);font-weight:400}
footer .fline{display:inline}
footer .fline+.fline::before{content:"·";margin:0 7px;color:#3c4859}
#tlbar{position:absolute;left:16px;right:16px;bottom:14px;background:rgba(20,26,34,.96);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:none;z-index:6;box-shadow:0 4px 18px rgba(0,0,0,.45)}
#tlbar .tl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#tlbar button{padding:4px 11px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font-size:12px;cursor:pointer;min-width:62px}
#tlbar button:hover{border-color:var(--amber)}
#tlbar input[type=range]{flex:1;min-width:180px;accent-color:var(--amber)}
.tl-date{font-size:15px;color:var(--amber);white-space:nowrap}
.tl-read{font-size:11px;color:var(--muted);white-space:nowrap}
.tl-read b{color:var(--text);font-weight:500}
.tl-ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:2px;padding:0 2px}
#gap{display:none;padding:16px 20px 30px}
.gapstats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.gapstat{background:var(--panel2);border-radius:8px;padding:9px 13px;font-size:11px;color:var(--muted)}
.gapstat b{display:block;font-size:19px;color:var(--amber);font-weight:500;margin-top:2px}
.matrix{width:100%;border-collapse:separate;border-spacing:3px;font-size:11px;table-layout:fixed}
.matrix th{color:var(--muted);font-weight:400;font-size:10px;padding:4px 2px;text-align:center;white-space:nowrap}
.matrix th.rh{text-align:left;width:150px;color:var(--text);font-size:11px}
.matrix td{text-align:center;padding:7px 2px;border-radius:4px;cursor:pointer;color:#1c232b}
.matrix td.zero{background:transparent;border:1px dashed #b8544c;color:#e8797a;font-weight:500;opacity:.62}
.matrix td.zero:hover{background:#3a2226;opacity:1}
.matrix td.hot{cursor:pointer}
.matrix td.hot:hover{box-shadow:inset 0 0 0 1px rgba(255,226,178,.6)}
.matrix td.rh{text-align:left;color:var(--text);font-size:11px;background:transparent;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matrix .rowsum{color:var(--dim);font-size:10px}
.gapnote{font-size:11.5px;color:var(--text);margin:12px 0;line-height:1.8}
.mhint{display:none;font-size:10.5px;color:var(--amber);margin:8px 0 4px}
#card{position:fixed;inset:0;background:rgba(6,9,13,.82);display:none;z-index:50;overflow:auto;padding:26px 16px}
#toast{position:fixed;top:74px;right:20px;background:#1c2430;border:1px solid #3a4553;border-radius:8px;padding:9px 14px;font-size:12px;color:var(--text);display:none;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.cardbox{max-width:520px;margin:0 auto}
.paper{background:#f7f2e8;color:#22262e;border:1px solid #ded3bc;border-radius:3px;padding:26px 28px 22px;box-shadow:none;font-family:"Songti SC","SimSun",serif;position:relative}
.paper .ptop{display:flex;justify-content:space-between;font-size:11px;color:#8a7b62;letter-spacing:.08em;border-bottom:1px solid #d8cbb2;padding-bottom:8px}
.paper h3{font-size:19px;font-weight:500;margin:16px 0 4px;line-height:1.5}
.paper .psub{font-size:12px;color:#8a7b62;margin-bottom:16px}
.paper .prule{border-top:1px solid #d8cbb2;margin:14px 0}
.paper .prow{display:flex;gap:12px;padding:7px 0;font-size:13px;line-height:1.7;border-bottom:1px dotted #ded3bc}
.paper .prow .pk{width:74px;flex:none;color:#8a7b62;font-size:12px}
.paper .prow .pv{flex:1;word-break:break-word;white-space:pre-line}
.paper .pv.pvcopyrow{cursor:pointer;color:#2f6fa8}
.paper .pv.pvcopyrow:hover{color:#1a4f80}
.paper .pv .pcopyhint{color:#a0906f;font-size:11px;margin-left:9px;white-space:nowrap}
.paper .pv.pvcopyrow.ok,.paper .pv.pvcopyrow.ok .pcopyhint{color:#2f6f52}
.paper .pbig{font-size:16px;color:#8f332a;line-height:1.7;margin:10px 0}
.paper .pfoot{font-size:11px;color:#8a7b62;margin-top:16px;border-top:1px solid #d8cbb2;padding-top:10px;line-height:1.8}
.paper .stamp{position:absolute;right:26px;top:52px;border:2px solid #b23b2e;color:#b23b2e;font-size:12px;padding:5px 8px;transform:rotate(-9deg);opacity:.82;letter-spacing:.1em}
.cardbtns{display:flex;gap:8px;justify-content:flex-end;margin:12px 0 24px}
.cardbtns button{padding:6px 13px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);font-size:12px;cursor:pointer}
.cardbtns button:hover{border-color:var(--amber)}
@media(max-width:1100px){#side{display:none}#detail{width:280px}}
@media(max-width:820px){
  header{flex-wrap:wrap;padding:10px 14px;row-gap:6px}
  .hnav{margin-left:auto;flex-wrap:wrap}
  .hnav a{margin-left:13px;font-size:11px}
  .brand{min-width:0}
  .brand .en{display:none}
  #toolbar{flex-wrap:wrap;padding:8px 12px;gap:6px;row-gap:8px}
  .tabs{overflow-x:auto;max-width:100%;min-width:0;scrollbar-width:none}
  .tab{white-space:nowrap;flex:none}
  .search{flex:none;order:9}
  #sbox{width:calc(100vw - 20px)}
  .sep{display:none}
  main{flex-direction:column}
  #detail{width:auto;border-left:none;border-top:1px solid var(--line);order:2}
  #stage{height:74vh;min-height:420px}
  #hint{font-size:10px;max-width:70%}
  /* 研究空白：手机适配 */
  #gap{padding:14px 12px 22px}
  .gapstats{gap:6px;margin:10px 0}
  .gapstat{padding:6px 10px;font-size:10px;flex:1 1 40%}
  .gapstat b{font-size:15px}
  .mwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .matrix{min-width:640px;table-layout:auto}
  .matrix thead th{position:static}
  .matrix th:not(.rh),.matrix td:not(.rh){min-width:30px}
  .matrix th.rh,.matrix td.rh{position:sticky;left:0;z-index:2;background:var(--bg);max-width:108px;font-size:10px}
  .matrix td{padding:8px 4px}
  .mhint{display:block}
  .gapnote{font-size:10.5px}
}
@media(max-width:820px){#card{padding:14px 10px}}
</style>
</head>
<body>
<div id="app">

<script>
const D = JSON.parse(document.getElementById('cz-data').textContent);
const N = new Map(D.nodes.map(n => [n.id, n]));
const ADJ = new Map();
for (const n of D.nodes) ADJ.set(n.id, []);
for (const e of D.edges) {
  if (!N.has(e.s) || !N.has(e.t)) continue;
  ADJ.get(e.s).push({ e, o: e.t });
  if (e.t !== e.s) ADJ.get(e.t).push({ e, o: e.s });
}
const byType = {};
for (const n of D.nodes) (byType[n.type] ||= []).push(n);

// 四类节点严格区分：外部理论原典 / 网友二创概念 / 原始语料 / 网友二创分析
// 圈内 466 个「理论/概念」标签经辨析：325 个归入理论原典（异写），141 个才是二创概念
// 学科只是筛选维度，不再用颜色区分节点；左侧筛选器统一中性蓝
function discColor(){return '#7c9cd6';}
const TYPE = {
  canon:{c:'#ffab2e',label:'理论原典'},
  theory:{c:'#2fd8a4',label:'二创概念'},
  corpus:{c:'#ff5f9e',label:'原始语料'},
  post:{c:'#5da9ff',label:'二创分析'}
};
function typeOf(n){return n.type;}
function nodeColor(n){return TYPE[n.type].c;}
const RING_DEFS=[
  {k:'canon',label:'理论原典 · 高频',col:'#ffab2e',rgba:'rgba(255,171,46,.16)'},
  {k:'canon2',label:'理论原典 · 单次调用',col:'#ffab2e',rgba:'rgba(255,171,46,.08)'},
  {k:'corpus',label:'原始语料',col:'#ff5f9e',rgba:'rgba(255,95,158,.12)'},
  {k:'theory',label:'二创概念',col:'#2fd8a4',rgba:'rgba(47,216,164,.13)'},
  {k:'post',label:'二创分析',col:'#5da9ff',rgba:'rgba(93,169,255,.11)'}
];
// 边的关系：知识图谱的五种三元组关系。flip=true 表示语义方向与数据方向相反
const REL={
  cites:{label:'引用',color:'#5a6b85',op:0.3,lw:0.6,arrow:true,flip:false,desc:'二创分析 → 概念／原典'},
  corpus:{label:'取材',color:'#ff5f9e',op:0.26,lw:0.6,arrow:true,flip:false,desc:'二创分析 → 原始语料'},
  canon:{label:'借用',color:'#ffab2e',op:0.45,lw:0.9,arrow:true,flip:false,desc:'二创概念 → 理论原典'},
  origin:{label:'首发',color:'#8fa3c0',op:0.38,lw:0.9,arrow:true,flip:true,desc:'出处帖 → 二创概念'}
};
function conceptNature(n){
  return '网友自造的二创概念' + (n.canonRef ? ' · 借自外部原典：' + n.canonLabel : ' · 无外部原典') + (n.isNative ? ' · 圈内标纯稚原创' : '');
}
function nodeSize(n){
  if(n.type==='post') return 2.7;
  if(n.type==='corpus') return 6 + Math.sqrt(Math.max(1,n._cnt||1))*1.1;
  if(n.type==='canon') return 4.0 + Math.sqrt(Math.max(1,(n.citeCount||0)+(n.derivedCount||0)))*1.1;
  return 3.4 + Math.sqrt(Math.max(1,n.post_count||1))*2.1;
}
for(const e of D.edges){
  if(e.rel==='cites'||e.rel==='canon'||e.rel==='corpus'){
    const t=N.get(e.t); if(t) t._cnt=(t._cnt||0)+1;
  }
}
for(const n of D.nodes) n._r = nodeSize(n);
const LABEL_THEORY=new Set(byType.theory.slice().sort((a,b)=>(b.post_count||0)-(a.post_count||0)).slice(0,10).map(n=>n.id));
const LABEL_CANON=new Set((byType.canon||[]).slice().sort((a,b)=>(b.citeCount||0)-(a.citeCount||0)).slice(0,10).map(n=>n.id));
const LAYER_TYPES=['canon','theory','corpus','post'];
function canonRefs(ths){
  const m=new Map();
  for(const t of ths){if(!t.canonRef)continue;if(!m.has(t.canonRef))m.set(t.canonRef,t.canon&&N.has(t.canon)?t.canon:null);}
  return [...m.entries()].map(([ref,id])=>({ref,id}));
}

// ---------------- timeline data ----------------
const TL_DATES=[...new Set(byType.post.map(p=>p.date).filter(Boolean))].sort();
const NODE_FIRST=new Map();
for(const p of byType.post) NODE_FIRST.set(p.id,p.date||'9999-99-99');
function minLinkedDate(id,rel){
  let m='9999-99-99';
  for(const a of ADJ.get(id)||[]) if(a.e.rel===rel){const d=NODE_FIRST.get(a.o);if(d&&d<m)m=d;}
  return m==='9999-99-99'?null:m;
}
for(const t of byType.theory){
  let d=t.origin&&N.has('p:'+t.origin)?N.get('p:'+t.origin).date:null;
  if(!d)d=minLinkedDate(t.id,'cites');
  NODE_FIRST.set(t.id,d||TL_DATES[TL_DATES.length-1]);
}
for(const c of (byType.canon||[])) NODE_FIRST.set(c.id,minLinkedDate(c.id,'cites')||TL_DATES[TL_DATES.length-1]);
for(const c of byType.corpus) NODE_FIRST.set(c.id,minLinkedDate(c.id,'corpus')||TL_DATES[TL_DATES.length-1]);
const TL_NEW={};
for(const dt of TL_DATES) TL_NEW[dt]={
  posts:byType.post.filter(p=>p.date===dt).length,
  theories:byType.theory.filter(t=>NODE_FIRST.get(t.id)===dt).length
};
function born(id){return view!=='timeline'||(NODE_FIRST.get(id)||'9999-99-99')<=tlDate;}

// ---------------- state ----------------
let view='overview', query='', discFilter=null, selected=null, hovered=null;
let tlDate=TL_DATES[TL_DATES.length-1], tlPlaying=false, tlTimer=null, tlAutoTimer=null, tlPos=TL_DATES.length-1;
let RAD={};
let layers={canon:true,theory:true,corpus:true,post:true};
const VIEW_CFG={
  overview:{types:['canon','theory','corpus','post'],rels:['canon','origin','cites','corpus'],radial:true},
  timeline:{types:['canon','theory','corpus','post'],rels:['canon','origin','cites','corpus'],radial:true},
  corpus:{types:['corpus','post'],rels:['corpus'],radial:false}
};
let VN=[], VE=[], alpha=1, simOn=true;
let layoutLocked=false;                                  // 检索后把现有布局按住：位置不再随力导向漂移
let lockTimer=null;                                      // 布局还在铺开时的延迟上锁
let corpusT0=0;                                          // 语料总览入场动画起点（每次进入都重放）
let tx=0, ty=0, scale=1;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  dpr=Math.min(2,window.devicePixelRatio||1); W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

// 播放条高度会随刻度渲染、窄屏换行、字号变化而变：持续同步给左下浮标的让位变量
const tlbarEl=document.getElementById('tlbar');

function canonSet(){
  const s=new Set();
  for(const n of D.nodes) if(n.type==='canon') s.add(n.id);
  for(const e of D.edges) if((e.rel==='cites'||e.rel==='canon')&&s.has(e.t)) s.add(e.s);
  return s;
}
const CANON_SET=canonSet();
// 至少取一处原始语料的二创分析（语料总览只陈列这批帖）
const CORPUS_POSTS=new Set();
for(const e of D.edges) if(e.rel==='corpus') CORPUS_POSTS.add(e.s);

function buildView(){
  const cfg=VIEW_CFG[view];
  const allowTypes=new Set(cfg.types);
  const allowRels=new Set(cfg.rels);
  const keep=new Set();
  let discPosts=null;
  if(discFilter){
    discPosts=new Set();
    for(const e of D.edges) if(e.rel==='cites'){
      const t=N.get(e.t);
      if(t&&(t.discRaw||[]).includes(discFilter)) discPosts.add(e.s);
    }
  }
  for(const n of D.nodes){
    if(!allowTypes.has(n.type)) continue;
    if(!layers[typeOf(n)]) continue;
    if(view==='canon'&&!CANON_SET.has(n.id)) continue;
    if(view==='corpus'&&n.type==='post'&&!CORPUS_POSTS.has(n.id)) continue; // 未取语料的帖不进入语料总览
    if(discFilter){
      if(n.type==='post'&&!discPosts.has(n.id))continue;
      if(n.type==='theory'&&!(n.discRaw||[]).includes(discFilter))continue;
      if(n.type==='canon'){ if(!(n.discRaw||[]).includes(discFilter))continue; }
    }
    keep.add(n.id);
  }
  VN=D.nodes.filter(n=>keep.has(n.id));
  VE=D.edges.filter(e=>allowRels.has(e.rel)&&keep.has(e.s)&&keep.has(e.t));
  const cx=W/2, cy=H/2, R=Math.max(180,Math.min(W,H)/2-38);
  // 五层分环：高频理论原典 → 单次调用的理论原典 → 节目原始语料 → 网友二创概念 → 网友二创分析
  RAD=(view==='canon')
    ? {canon:R*0.34,canon2:R*0.62,corpus:R*0.72,theory:R*0.82,post:R*0.98}
    : {canon:R*0.26,canon2:R*0.46,corpus:R*0.58,theory:R*0.76,post:R*0.96};
  VN.forEach((n,i)=>{
    const ang=(i*2.399963)+ (n.type==='post'?0.4:0);
    let rad=cfg.radial?(RAD[n.type]||R*0.5):0;
    if(n.type==='canon'&&cfg.radial) rad = n.hub ? RAD.canon : RAD.canon2;
    n._ang=ang;                                            // 记录环向角度：播放时新节点沿环扫描式依次生长
    n.x=cx+Math.cos(ang)*rad+(Math.random()-.5)*26;
    n.y=cy+Math.sin(ang)*rad+(Math.random()-.5)*26;
    n.vx=0; n.vy=0; n.fixed=false;
    n._rad=rad; n._tx=null; n._ty=null;
  });
  if(view==='corpus'){
    // 语料总览：12 处原始语料按取材量降序钉在椭圆环上，取材帖聚到自己语料的环边，
    // 同时取多处的帖落在两处语料之间，天然成为「桥」，看得出哪些名场面被放在一起读。
    const hubs=VN.filter(n=>n.type==='corpus').sort((a,b)=>(b._cnt||0)-(a._cnt||0));
    VN.sort((a,b)=>(a.type==='corpus'?1:0)-(b.type==='corpus'?1:0));  // 语料后画，压在帖点之上，来源一眼可辨
    const rx=Math.max(200,Math.min(W*0.36,520)), ry=Math.max(130,Math.min(H*0.30,196));
    hubs.forEach((n,i)=>{
      const ang=-Math.PI/2+i*2*Math.PI/Math.max(1,hubs.length);
      n.x=cx+Math.cos(ang)*rx; n.y=cy+Math.sin(ang)*ry;
      n.vx=0;n.vy=0;n.fixed=true;n._rad=0;n._ang=ang;
    });
    const hubPos=new Map(hubs.map(n=>[n.id,[n.x,n.y]]));
    const hubIdx=new Map(hubs.map((n,i)=>[n.id,i]));
    hubs.forEach((n,i)=>{                                  // 语料核：从环内向自己的位置「长」出去
      n._idx=i; n._sw=0; n._ph=(hashId(n.id)%628)/100;
      n._gx=cx+(n.x-cx)*0.30; n._gy=cy+(n.y-cy)*0.30;
    });
    for(const n of VN){
      if(n.type!=='post')continue;
      const lk=(ADJ.get(n.id)||[]).filter(a=>a.e.rel==='corpus'&&hubPos.has(a.o));
      if(!lk.length){n._tx=cx;n._ty=cy;continue;}
      let ax=0,ay=0;for(const a of lk){const p=hubPos.get(a.o);ax+=p[0];ay+=p[1];}
      n._tx=ax/lk.length; n._ty=ay/lk.length;
      n.x=n._tx+(Math.random()-.5)*80; n.y=n._ty+(Math.random()-.5)*80;
      n.vx=0;n.vy=0;n.fixed=false;
      // 入场顺序：跟着「取材最多的那处语料」一起长，再沿语料核转一圈依次冒出来
      let best=99,bp=null;
      for(const a of lk){const k=hubIdx.get(a.o);if(k<best){best=k;bp=hubPos.get(a.o);}}
      n._idx=best; n._gx=bp?bp[0]:cx; n._gy=bp?bp[1]:cy;
      n._sw=((Math.atan2(n.y-n._gy,n.x-n._gx)+Math.PI)/(Math.PI*2));
      n._ph=(hashId(n.id)%628)/100;
    }
  }
  alpha=1; simOn=true; layoutLocked=false;                 // 换视图＝重新布局，先解锁再让力导向跑起来
  if(view==='corpus'){
    for(let i=0;i<520;i++) step();                        // 先算稳再入场：十二个语料簇一次成形，不抖不飘
    simOn=false; alpha=0.004;
    fitCorpusView();
    VE.forEach((e,i)=>{e._i=i;});                          // 连线流光沿边跑动时的相位
    corpusT0=performance.now();
  }
  document.getElementById('loading').style.display='none';
  draw();
}
// 语料总览：把整个星座缩放到画布内（视口宽窄、语料多少都不会被切边）
function fitCorpusView(){
  if(!VN.length)return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const n of VN){
    const r=(n._r||3)+8;
    if(n.x-r<x0)x0=n.x-r; if(n.x+r>x1)x1=n.x+r;
    if(n.y-r<y0)y0=n.y-r; if(n.y+r>y1)y1=n.y+r;
  }
  const padX=78,padY=62;
  const sx=(W-padX*2)/Math.max(1,x1-x0), sy=(H-padY*2)/Math.max(1,y1-y0);
  scale=Math.max(0.36,Math.min(1.15,Math.min(sx,sy)));
  // 屏幕中心对齐星座中心（wx 里有 W/2*(1-scale) 的常数项，不能只写 -c*scale）
  tx=scale*(W/2-(x0+x1)/2); ty=scale*(H/2-(y0+y1)/2);
}

// ---------------- force ----------------
function step(){
  if(layoutLocked||!simOn||alpha<0.005) return;
  const cfg=VIEW_CFG[view];
  const C=W/2,Hc=H/2;
  const cell=64, grid=new Map();
  for(let i=0;i<VN.length;i++){
    const n=VN[i]; const k=((n.x/cell)|0)+','+((n.y/cell)|0);
    let a=grid.get(k); if(!a){a=[];grid.set(k,a);} a.push(n);
  }
  for(let i=0;i<VN.length;i++){
    const n=VN[i], gx=(n.x/cell)|0, gy=(n.y/cell)|0;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      const a=grid.get((gx+dx)+','+(gy+dy)); if(!a)continue;
      for(const m of a){
        if(m===n)continue;
        let ddx=n.x-m.x, ddy=n.y-m.y, d2=ddx*ddx+ddy*ddy;
        if(d2>cell*cell*2.25||d2<0.01)continue;
        const d=Math.sqrt(d2), min=n._r+m._r+5;
        let f=(min*min/Math.max(d2,20))*(view==='corpus'?0.9:0.75)*alpha;
        if(d<min) f+= (min-d)*0.06*alpha;
        n.vx+=ddx/d*f; n.vy+=ddy/d*f;
      }
    }
  }
  const LEN={cites:52,canon:78,origin:64,corpus:70};
  for(const e of VE){
    const a=N.get(e.s),b=N.get(e.t); if(!a||!b)continue;
    const ddx=b.x-a.x,ddy=b.y-a.y,d=Math.max(1,Math.hypot(ddx,ddy));
    const L=(view==='corpus'&&e.rel==='corpus')?44:(LEN[e.rel]||60), k=0.0045*alpha;
    const f=(d-L)*k;
    const fx=ddx/d*f, fy=ddy/d*f;
    if(!a.fixed){a.vx+=fx;a.vy+=fy;} if(!b.fixed){b.vx-=fx;b.vy-=fy;}
  }
  for(const n of VN){
    if(cfg.radial&&n._rad>0){
      const dx=n.x-C,dy=n.y-Hc,d=Math.max(1,Math.hypot(dx,dy));
      const f=(n._rad-d)*0.08*alpha;
      n.vx+=dx/d*f;n.vy+=dy/d*f;
    }else{
      // 语料总览：贴住自己那处语料（多点取材的帖落在两者之间），而非全图重心
      const gx=n._tx!=null?n._tx:C, gy=n._ty!=null?n._ty:Hc;
      const k=(view==='corpus')?0.012:0.0016;
      n.vx+=(gx-n.x)*k*alpha;n.vy+=(gy-n.y)*k*alpha;
    }
    if(n.fixed){n.vx=0;n.vy=0;continue;}
    n.vx*=0.82;n.vy*=0.82;
    n.x+=Math.max(-18,Math.min(18,n.vx));n.y+=Math.max(-18,Math.min(18,n.vy));
  }
  alpha*=0.992;
  if(alpha<0.005) simOn=false;
}
function wx(x){return x*scale+tx+W/2*(1-scale);}
function wy(y){return y*scale+ty+H/2*(1-scale);}
function iwx(x){return (x-tx-W/2*(1-scale))/scale;}
function iwy(y){return (y-ty-H/2*(1-scale))/scale;}

function neighbors(id){
  const s=new Set([id]), es=new Set();
  for(const a of ADJ.get(id)||[]){s.add(a.o);es.add(a.e);}
  return {s,es};
}
// 边的语义方向（首发 flip：数据存 出处帖→概念，语义同向，但绘制时箭头翻到 t 端）
function edgeSrc(e){const R=REL[e.rel];return R&&R.flip?e.t:e.s;}
function edgeDst(e){const R=REL[e.rel];return R&&R.flip?e.s:e.t;}
// 悬停节点与选中节点之间的关系：返回 [{label, dir:'out'|'in'|'both'}]
function relToSel(hid,sid){
  const out=[];
  for(const a of ADJ.get(hid)||[]){
    if(a.o!==sid)continue;
    const e=a.e, R=REL[e.rel]||REL.cites;
    const dir=edgeSrc(e)===hid?'out':'in';
    out.push({label:R.label,dir,color:R.color});
  }
  return out;
}
let near={s:new Set(),es:new Set()};
function draw(){
  ctx.clearRect(0,0,W,H);
  const nowMs=performance.now();
  // 焦点优先级：点选的节点优先，悬停只作补充 —— 点过节点后可逐个悬停它的关联节点查看
  const baseId=selected||hovered;
  near=baseId?neighbors(baseId):{s:new Set(),es:new Set()};
  // 已有选中节点时悬停某个关联节点：把它的邻边也点亮一档，方便沿关系继续追踪
  const hov=(selected&&hovered&&hovered!==selected)?neighbors(hovered):null;
  const focus=baseId;
  const q=query.trim().toLowerCase();
  const matchSet=new Set();
  if(q) for(const n of VN) if((n.label+' '+(n.sub||'')+' '+(n.author||'')+' '+(n.canonRef||'')+' '+((n.variants||[]).join(' '))+' '+(n.classReason||'')).toLowerCase().includes(q)) matchSet.add(n.id);

  if((view==='overview'||view==='timeline')&&!focus){
    const cx=wx(W/2),cy=wy(H/2);
    ctx.setLineDash([2,8]);ctx.lineWidth=1;
    for(const d of RING_DEFS){
      ctx.strokeStyle=d.rgba;ctx.beginPath();ctx.arc(cx,cy,RAD[d.k]*scale,0,6.283);ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  // 边：关系 → 颜色/线宽/是否有向。flip 表示语义方向与数据方向相反（首发：出处帖 → 概念）
  const arrowOn=scale>0.3, relLabels=[];
  for(const e of VE){
    const a=N.get(e.s),b=N.get(e.t); if(!a||!b)continue;
    const pA=nodeProg(e.s,nowMs),pB=nodeProg(e.t,nowMs),ep=pA*pB;
    if(ep<=0.002)continue;
    const R=REL[e.rel]||REL.cites;
    let col=R.color, lw=R.lw, op=R.op;
    if(view==='corpus'&&e.rel==='corpus'){op=0.34;lw=0.75;}   // 语料总览的连线是主结构，略微提亮
    if(focus){
      const on=near.es.has(e)||((near.s.has(e.s)||near.s.has(e.t))&&near.s.has(e.s)&&near.s.has(e.t));
      const on2=hov&&hov.es.has(e);
      if(on){op=Math.min(1,op+0.62);lw+=0.9;}
      else if(on2){op=Math.min(0.78,op+0.34);lw+=0.45;}
      else {op=0.028;lw=0.5;}
    }
    if(q && !focus){op*= (matchSet.has(e.s)||matchSet.has(e.t))?1.6:0.18;}
    op*=Math.min(1,ep*1.15); lw*=0.35+0.65*Math.min(1,ep); // 新生长出的连线随节点由淡到实（无下限，真正从无到有）
    const pa=nodePos(a,pA), pb=nodePos(b,pB);             // 端点用生长中的实际落位：新节点还在从中心长出来的路上，连线跟着它走
    const ax=wx(pa[0]),ay=wy(pa[1]),bx=wx(pb[0]),by=wy(pb[1]);
    const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);
    if(len<0.6)continue;
    const ux=dx/len,uy=dy/len;
    const rA=Math.max(0.4,a._r*Math.min(1.6,Math.max(0.6,scale))*growR(pA));
    const rB=Math.max(0.4,b._r*Math.min(1.6,Math.max(0.6,scale))*growR(pB));
    // 起点/终点都收到节点边缘，箭头落在被指向的一端
    let sx=R.flip?bx-ux*rB:ax+ux*rA, sy=R.flip?by-uy*rB:ay+uy*rA;
    let ex=R.flip?ax+ux*rA:bx-ux*rB, ey=R.flip?ay+uy*rA:by-uy*rB;
    const dirX=R.flip?-ux:ux, dirY=R.flip?-uy:uy;
    // 生长中：连线从已存在的一端向新节点方向缓缓延伸，而不是整条突然出现
    const gl=ep>=0.999?1:Math.pow(ep,0.75);                // 从旧端向新节点缓缓伸展（指数调高，起步更慢、更像生长）
    if(gl<1){ex=sx+(ex-sx)*gl; ey=sy+(ey-sy)*gl;}
    // 语料总览不画箭头：几十条线收在同一个语料核上会结成锯齿状黑边，方向交给流光点表达
    const head=R.arrow&&arrowOn&&op>0.07&&gl>0.9&&!(view==='corpus'&&e.rel==='corpus')?7.4:0;
    ctx.globalAlpha=Math.min(1,op);
    ctx.strokeStyle=col;ctx.lineWidth=lw;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex-dirX*head*0.85,ey-dirY*head*0.85);ctx.stroke();
    if(head){
      const aw=3.5;
      ctx.beginPath();
      ctx.moveTo(ex,ey);
      ctx.lineTo(ex-dirX*head-dirY*aw,ey-dirY*head+dirX*aw);
      ctx.lineTo(ex-dirX*head+dirY*aw,ey-dirY*head-dirX*aw);
      ctx.closePath();ctx.fillStyle=col;ctx.fill();
    }
    // 语料总览：一枚小光点沿边从「分析」跑向「语料」，表示取材方向 —— 静态图里的持续动势
    if(view==='corpus'&&gl>0.985&&op>0.10){
      const ph=((nowMs*0.00022)+(e._i||0)*0.137)%1;
      const fx=sx+(ex-sx)*ph, fy=sy+(ey-sy)*ph;
      ctx.globalAlpha=Math.min(1,op)*0.85*(0.35+0.65*Math.sin(Math.PI*ph));
      ctx.fillStyle='#ffc2da';
      ctx.beginPath();ctx.arc(fx,fy,1.25,0,6.283);ctx.fill();
    }
    if(focus&&near.es.has(e)&&op>0.35)relLabels.push({x:(ax+bx)/2,y:(ay+by)/2,label:R.label,col,arrow:R.arrow});
  }
  ctx.globalAlpha=1;
  // 关系名：只标注当前聚焦节点的邻边，避免 1700+ 条边全部糊在一起
  if(relLabels.length){
    ctx.font='500 10.5px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const placed=[];
    for(const L of relLabels.slice(0,60)){
      if(placed.some(p=>Math.hypot(p.x-L.x,p.y-L.y)<26))continue;
      placed.push(L);
      const w=Math.max(30,ctx.measureText(L.label).width+14);
      ctx.globalAlpha=.94;
      ctx.fillStyle='rgba(16,21,28,.92)';ctx.fillRect(L.x-w/2,L.y-9,w,18);
      ctx.strokeStyle=L.col;ctx.lineWidth=.7;ctx.strokeRect(L.x-w/2,L.y-9,w,18);
      ctx.fillStyle=L.col;ctx.fillText(L.label,L.x,L.y);
    }
    ctx.globalAlpha=1;
  }
  const labelBoxes=[], corpusLabels=[];
  for(const n of VN){
    const p=nodeProg(n.id,nowMs);
    if(p<=0.008)continue;
    const gp=nodePos(n,p);                                // 节点也画在生长中的实际位置上
    const x=wx(gp[0]),y=wy(gp[1]);
    const rBase=Math.max(0.4,n._r*Math.min(1.6,Math.max(0.6,scale))*growR(p));
    // 语料核缓慢起伏（±10%，周期约 5.7 秒，相位按语料错开）：像心跳，不是晃
    const hubPulse=(view==='corpus'&&n.type==='corpus'&&p>0.9)?1+0.10*Math.sin(nowMs*0.0011+(n._ph||0)):1;
    const r=rBase*hubPulse;
    if(x<-40||x>W+40||y<-40||y>H+40)continue;
    let op=smoothP(Math.min(1,p*1.05));            // 从小点渐显，而不是突然出现
    const isNb=near.s.has(n.id);
    if(focus&&!isNb)op=(hov&&hov.s.has(n.id))?0.40:0.11;
    if(q&&!focus&&!matchSet.has(n.id))op=0.18;
    if(n.id===selected||n.id===hovered){op=1;}
    ctx.globalAlpha=op;
    const c=nodeColor(n);
    // 语料核的心跳圈：一圈极淡的粉环缓缓扩散，让十二处语料像还在被反复讨论
    if(view==='corpus'&&n.type==='corpus'&&p>0.9&&!focus){
      const k=((nowMs*0.00036)+(n._ph||0)*0.17)%1;
      ctx.globalAlpha=op*0.26*(1-k);
      ctx.strokeStyle='#ff8fbd';ctx.lineWidth=1.1;
      ctx.beginPath();ctx.arc(x,y,rBase+5+k*26,0,6.283);ctx.stroke();
      ctx.globalAlpha=op;
    }
    // 被点亮的关联节点：外圈同色光环，让「点亮」一眼可见
    if(selected&&n.id!==selected&&isNb){
      ctx.beginPath();ctx.arc(x,y,r+4.5,0,6.283);
      ctx.strokeStyle=c;ctx.globalAlpha=Math.min(1,op*0.55);ctx.lineWidth=1.1;ctx.stroke();
      ctx.globalAlpha=op;
    }
    if(n.id===selected){ctx.beginPath();ctx.arc(x,y,r+6,0,6.283);ctx.strokeStyle='#f2f6fb';ctx.lineWidth=1.2;ctx.stroke();}
    if(n.id===hovered){ctx.beginPath();ctx.arc(x,y,r+5.5,0,6.283);ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.stroke();}
    ctx.beginPath();ctx.arc(x,y,r,0,6.283);
    ctx.fillStyle=c;ctx.fill();
    if(n.type!=='post'){ctx.strokeStyle='rgba(13,16,21,.8)';ctx.lineWidth=0.8;ctx.stroke();}
    // 播放时不再给「当日新增的高频概念」套白色圆环：整片白圈会盖住节点本身的颜色
    const isFocus=n.id===selected||n.id===hovered;
    const isCorpusHub=(view==='corpus')&&n.type==='corpus';
    let showLabel = isFocus || (n.type==='theory'&&LABEL_THEORY.has(n.id)) || (n.type==='canon'&&LABEL_CANON.has(n.id)) || (q&&matchSet.has(n.id));
    if(focus&&!isNb&&!isFocus)showLabel=false;   // 聚焦时只留关联节点的名字，其余不抢位
    if(isCorpusHub&&!isFocus){corpusLabels.push({n,x,y,r:rBase,op});showLabel=false;}  // 语料名最后统一画，压在帖点之上
    if(showLabel&&scale>0.45){
      let lab=n.label;
      if(!isFocus&&lab.length>9)lab=lab.slice(0,8)+'…';
      if(isFocus&&lab.length>22)lab=lab.slice(0,21)+'…';
      ctx.font=(isFocus?'600 12.5px':'500 11.5px')+' -apple-system,"PingFang SC",sans-serif';
      const ly=y+r+4, w=ctx.measureText(lab).width+12;
      const box={x:x-w/2,y:ly-1,w:w,h:19};
      let clash=false;
      if(!isFocus)for(const b of labelBoxes){
        if(box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y){clash=true;break;}
      }
      if(!clash){
        labelBoxes.push(box);
        if(isFocus){
          ctx.fillStyle='rgba(20,26,34,.92)';ctx.fillRect(box.x,box.y,w,19);
          ctx.strokeStyle=c;ctx.lineWidth=0.6;ctx.strokeRect(box.x,box.y,w,19);
        }
        ctx.fillStyle=isFocus?'#ffffff':(focus&&!near.s.has(n.id)?'#7d8ba2':'#e9f1fc');
        ctx.textAlign='center';ctx.textBaseline='top';
        ctx.globalAlpha=Math.min(1,op);
        ctx.fillText(lab,x,ly+2);
      }
    }
  }
  ctx.globalAlpha=1;
  // 语料总览：十二处语料的名字最后画。名称一行、副题一行（「·」前后拆开），
  // 这样「铁幕演说 ·「再也不会和好」」这种长名也不会被截成半句。
  for(const it of corpusLabels){
    const {n,x,y,r,op}=it;
    const seg=n.label.split(/\s*·\s*/);
    const l1=(seg[0]||n.label), l2=seg.slice(1).join(' · ');
    ctx.font='600 12px -apple-system,"PingFang SC",sans-serif';
    const w1=ctx.measureText(l1).width;
    ctx.font='500 10.5px -apple-system,"PingFang SC",sans-serif';
    const w2=l2?ctx.measureText(l2).width:0;
    const w=Math.max(w1,w2)+16, hh=l2?32:20;
    const below = y < H*0.70;
    const ly = below ? y+r+6 : y-r-6-hh;
    const box={x:x-w/2,y:ly,w:w,h:hh};
    let clash=false;
    for(const b of labelBoxes){
      if(box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y){clash=true;break;}
    }
    if(clash)continue;
    labelBoxes.push(box);
    ctx.globalAlpha=Math.min(1,op);
    ctx.fillStyle='rgba(14,17,23,.86)';ctx.fillRect(box.x,box.y,w,hh);
    ctx.strokeStyle='rgba(255,95,158,.40)';ctx.lineWidth=.7;ctx.strokeRect(box.x,box.y,w,hh);
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle='#f7edf4';ctx.font='600 12px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(l1,x,ly+4);
    if(l2){ctx.fillStyle='#f2a3c2';ctx.font='500 10.5px -apple-system,"PingFang SC",sans-serif';ctx.fillText(l2,x,ly+19);}
  }
  ctx.globalAlpha=1;
  if(view==='overview'&&!focus){                            // 环标签只在引文总览画；发展历程把层名收到左下角图例里
    const cx=wx(W/2),cy=wy(H/2);
    ctx.font='600 11.5px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(const d of RING_DEFS){
      const y=cy-RAD[d.k]*scale-9;
      if(y<10||y>H-10)continue;
      const w=ctx.measureText(d.label).width+16;
      ctx.fillStyle='rgba(13,16,21,.88)';ctx.fillRect(cx-w/2,y-10,w,20);
      ctx.strokeStyle=d.rgba;ctx.lineWidth=1;ctx.strokeRect(cx-w/2,y-10,w,20);
      ctx.fillStyle=d.col;ctx.fillText(d.label,cx,y);
    }
  }
}

// ---------------- interaction ----------------
let drag=null, moved=false;
function pick(mx,my){
  const x=iwx(mx),y=iwy(my); let best=null,bd=1e9;
  for(const n of VN){if(!born(n.id))continue;const d=Math.hypot(n.x-x,n.y-y),r=Math.max(6,n._r+4/scale);if(d<r&&d<bd){bd=d;best=n;}}
  return best;
}
cv.addEventListener('mousedown',e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const n=pick(mx,my);
  drag={mx,my,tx0:tx,ty0:ty,node:n,nx:n?n.x:0,ny:n?n.y:0};moved=false;cv.classList.add('drag');
});
window.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(drag){
    const dx=mx-drag.mx,dy=my-drag.my;
    if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
    if(drag.node&&moved){drag.node.x=drag.nx+dx/scale;drag.node.y=drag.ny+dy/scale;drag.node.vx=0;drag.node.vy=0;drag.node.fixed=true;if(!layoutLocked){alpha=Math.max(alpha,0.25);simOn=true;}draw();}   // 锁定状态下只挪这一颗，别把整张图惊动
    else if(!drag.node){tx=drag.tx0+dx;ty=drag.ty0+dy;draw();}
    return;
  }
  if(mx<0||my<0||mx>W||my>H){hovered=null;tip.style.display='none';draw();return;}
  const n=pick(mx,my);
  if(n!==hovered){hovered=n?n.id:null;draw();}
  if(n){
    let relRow='';
    if(selected&&n.id!==selected){
      const rs=relToSel(n.id,selected);
      const selName=esc((N.get(selected)||{}).label||'选中节点');
      if(rs.length){
        const chips=rs.map(r=>'<span class="rc" style="color:'+r.color+';border-color:'+r.color+'55">'+r.label+(r.dir==='out'?' →':r.dir==='in'?' ←':' ↔')+'</span>').join('')+
          '<span class="tp">箭头指向「'+selName+'」（A → B 表示 A 引用／首发 B）</span>';
        relRow='<div class="trs">与「'+selName+'」的关系'+chips+'</div>';
      }else{
        relRow='<div class="trs dim">与「'+selName+'」无直接关系 · 二级关联</div>';
      }
    }
    tip.innerHTML='<div class="tt">'+esc(n.label)+'</div><div class="ts">'+TYPE[n.type].label+
      (n.type==='canon'?' · 外部既有原典 · 被 '+(n.citeCount||0)+' 篇分析直接调用':
       n.type==='theory'?' · 网友自造二创概念 · 被 '+(n.post_count||0)+' 篇分析调用':
       n.type==='post'?' · 网友二创分析':(n._cnt?' · 出现于 '+(n._cnt||0)+' 篇':''))+'</div>'+relRow;
    tip.style.display='block';
    tip.style.left=Math.max(8,Math.min(W-300,mx+14))+'px';tip.style.top=Math.max(8,Math.min(H-90,my+14))+'px';
  }else tip.style.display='none';
});
window.addEventListener('mouseup',e=>{
  if(drag&&!moved&&drag.node){selected=drag.node.id;renderDetail();draw();}
  else if(drag&&!moved&&!drag.node){selected=null;renderDetail();draw();}
  drag=null;cv.classList.remove('drag');
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const old=scale;scale=Math.max(0.3,Math.min(3.2,scale*(e.deltaY>0?0.9:1.1)));
  tx=(mx-W/2)-(mx-W/2-tx)*(scale/old);ty=(my-H/2)-(my-H/2-ty)*(scale/old);draw();
},{passive:false});
const tip=document.getElementById('tip');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function selectNode(id){

  const n=N.get(id);

    // 放宽筛选，保证节点可见
    for(const k in layers)layers[k]=true;discFilter=null;
    view='overview';syncTabs();renderLayers();renderSide();buildView();
  }
  // 只在该节点真的跑出可视区时才平移；已经在画面里就一动不动，检索后这张图才「固定得住」
  const px=wx(n.x),py=wy(n.y),m=80;
  if(px<m||px>W-m||py<m||py>H-m){
    if(searchOn&&!camSaved)camSaved={tx:tx,ty:ty};     // 记住平移前的机位，返回检索结果时复位

// ---------------- 发展历程（渐变生长） ----------------
let tlFrom=null, tlSwitchAt=0;      // 上一个快照日 / 本次切换时刻
// 每日生长分四波：先原始语料（名场面先发生）→ 再理论原典（被借用的理论）→ 再二创概念 → 最后二创分析
const GROW_STAGE={corpus:0, canon:300, theory:640, post:980};
const GROW_STAGE_MAX=980;
const GROW_MS=760, GROW_STAGGER=5, GROW_SWEEP=300; // 单节点生长时长 / 错峰抖动 / 同类内沿环扫描的波浪错峰
function growR(p){ // 带一点回弹的缓动，模拟「长出来」
  if(p>=1)return 1; if(p<=0)return 0;
  const q=p-1; return 1+2.70158*q*q*q+1.70158*q*q;
}
function smoothP(p){return p*p*(3-2*p);}  // 平滑淡入淡出
function progOf(id,now){
  if(view!=='timeline')return 1;
  const d=NODE_FIRST.get(id)||'9999-99-99';
  const inNow=d<=tlDate, inFrom=tlFrom!=null&&d<=tlFrom;
  if(inNow&&inFrom)return 1;
  if(!inNow&&!inFrom)return 0;
  const nd=N.get(id);
  // 分阶段错峰：类型决定起跑时刻（语料→原典→概念→分析），同类内再沿环向 0→2π 扫描，成片涌出
  const base=GROW_STAGE[(nd&&nd.type)||'post']||0;
  const stg=inNow?base:(GROW_STAGE_MAX-base);            // 退场：最晚出现的先撤
  const st=stg+((nd&&nd._ang!=null)?((nd._ang%6.2832)/6.2832)*GROW_SWEEP:0)+(Math.abs(hashId(id))%6)*GROW_STAGGER;
  let t=(now-tlSwitchAt-st)/GROW_MS; t=t<0?0:t>1?1:t;
  const e=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;          // easeInOutCubic：缓缓出现、缓缓收住
  return inNow?e:1-e;                                    // 新生日渐显，退场日渐隐
}
function drawPos(n,p){ // 生长中的节点从画布中心缓缓长到落位（学科从原点长成一圈圈环的意象）
  if(view!=='timeline'||p>=0.999||p<=0.001)return [n.x,n.y];
  const ox=iwx(W/2), oy=iwy(H/2);                         // 屏幕中心反算成节点坐标（必须走 iwx/iwy，否则缩放后会偏到画面右下角）
  const e=1-Math.pow(1-p,3);                              // easeOutCubic：先舒展后收住
  return [ox+(n.x-ox)*e, oy+(n.y-oy)*e];
}

// ---------------- 语料总览的动态：入场生长 + 呼吸 + 流光 ----------------
const CG_MS=620, CG_HUB_GAP=45;                          // 单节点生长时长 / 相邻语料核的起跑间隔
function corpusDelay(n){
  if(n.type==='corpus') return (n._idx||0)*CG_HUB_GAP;
  return 190+(n._idx||0)*CG_HUB_GAP+(n._sw||0)*230;      // 帖：跟着语料核长出后，沿核转一圈依次冒出来
}
function corpusProg(id,now){
  if(!corpusT0)return 1;
  const n=N.get(id); if(!n)return 1;
  const el=now-corpusT0-corpusDelay(n);
  if(el<=0)return 0;
  const t=Math.min(1,el/CG_MS);
  return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}
// 生长位移：从「所属语料核」向外长出；落位后留一点极缓的呼吸漂移（幅度约 2px，不影响点击）
function corpusPos(n,p){
  if(p>=0.999){
    const ph=n._ph||0, t=performance.now();
    return [n.x+Math.sin(t*0.00040+ph)*1.8, n.y+Math.cos(t*0.00031+ph*1.7)*1.5];
  }
  const gx=n._gx!=null?n._gx:n.x, gy=n._gy!=null?n._gy:n.y;
  const e=1-Math.pow(1-p,3);
  return [gx+(n.x-gx)*e, gy+(n.y-gy)*e];
}
// draw() 内统一分派：其他视图仍走学科历程那套生长逻辑
function nodeProg(id,now){ return view==='corpus'?corpusProg(id,now):progOf(id,now); }
function nodePos(n,p){ return view==='corpus'?corpusPos(n,p):drawPos(n,p); }
let growTimer=null, growUntil=0;
function kickGrow(ms){ // 16ms 定时器驱动重绘：rAF 被节流时生长动画依然逐帧渐变，不会整批跳出来
  growUntil=performance.now()+(ms||GROW_MS+GROW_STAGE_MAX+GROW_SWEEP+240);
  if(growTimer)return;
  growTimer=setInterval(()=>{
    if(view!=='timeline'||performance.now()>growUntil){
      clearInterval(growTimer);growTimer=null;
      if(view!=='gap')draw();
      return;
    }
    draw();
  },16);
}
function renderTimelineBar(){
  const r=document.getElementById('tlRange');
  r.min=0;r.max=TL_DATES.length-1;r.step=0.01;          // 小数步长：播放时滑块连续缓动
  document.getElementById('tlTicks').innerHTML=TL_DATES.map(d=>'<span>'+d.slice(5)+'</span>').join('');
  tlPos=Math.max(0,TL_DATES.indexOf(tlDate));
  tlFrom=null; tlSwitchAt=performance.now();             // 进入视图：整图从无到有生长
  kickGrow();                                            // 定时器驱动，确保这段生长真的逐帧画出来
  updateTimeline();
}
function fitTimelineView(){
  // 播放时自动缩放：整幅发展历程避开底部控制条与画布边缘，不被框线遮挡
  const Rmax=(RAD.post||300)+34;                          // 最外环半径 + 抖动与标签余量
  const top=40, bottom=104;                               // 顶部留给环标签，底部留给控制条
  const s=Math.min((W/2-42)/Rmax,(H-top-bottom)/2/Rmax,1.2);
  scale=Math.max(0.22,s);
  tx=0; ty=-((bottom-top)/2);                             // 圆心上移，向可用区居中
  draw();
}
function updateTimeline(){
  document.getElementById('tlRange').value=tlPos;
  document.getElementById('tlDate').textContent=tlDate;
  document.getElementById('tlPlay').textContent=tlPlaying?'❚❚ 暂停':'▶ 播放';
  draw();
}
function setTlDate(i,keepPos){
  const idx=Math.max(0,Math.min(TL_DATES.length-1,i));
  const next=TL_DATES[idx];
  if(!keepPos)tlPos=idx;                                 // 用户拖动/点击：滑块对齐整日
  if(next!==tlDate){                                     // 只有真正换日才推进生长状态；同一天重复设置不能把 tlFrom 抹成当天（否则生长进度会被判成 1，全体节点瞬亮）
    tlFrom=tlDate;
    tlDate=next;
    tlSwitchAt=performance.now();
    kickGrow();                                          // 定时器驱动，生长不依赖 rAF
  }
  updateTimeline();
}
function stopTimeline(){
  tlPlaying=false;
  if(tlTimer){clearInterval(tlTimer);tlTimer=null;}
  if(tlAutoTimer){clearTimeout(tlAutoTimer);tlAutoTimer=null;}
  const b=document.getElementById('tlPlay');if(b)b.textContent='▶ 播放';
}
// 播放：滑块缓动滑向下一日（easeInOutCubic），跨过整日才切换快照，节点随生长动画渐显
const TL_SLIDE_MS=1700, TL_HOLD_MS=560, TL_TICK_MS=16;   // 播放节奏放慢：给四波生长（语料→原典→概念→分析）留足时间
function playTimeline(){
  if(tlPlaying){stopTimeline();return;}
  if(TL_DATES.indexOf(tlDate)>=TL_DATES.length-1){tlPos=0;setTlDate(0);}
  tlPlaying=true;
  const end=TL_DATES.length-1;
  let from=tlPos, to=Math.min(end,Math.floor(tlPos+1e-6)+1);
  let phase='slide', t0=performance.now();
  const tick=now=>{
    if(!tlPlaying)return stopTimeline();
    const dt=now-t0, r=document.getElementById('tlRange');
    if(phase==='slide'){
      const t=Math.min(1,dt/TL_SLIDE_MS);
      const e=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;      // 起步慢、中段顺、收尾缓
      tlPos=from+(to-from)*e;
      if(r)r.value=tlPos;
      const day=Math.floor(tlPos+1e-6);
      if(day!==TL_DATES.indexOf(tlDate))setTlDate(day,true);
      if(t>=1){tlPos=to;if(r)r.value=to;setTlDate(to,true);phase='hold';t0=now;}
    }else if(dt>=TL_HOLD_MS){
      if(to>=end){stopTimeline();updateTimeline();return;}
      from=tlPos;to=to+1;phase='slide';t0=now;
    }
    draw();                                              // 播放期间由 16ms 定时器逐帧重绘，生长动画不依赖 rAF
  };
  tlTimer=setInterval(()=>tick(performance.now()),TL_TICK_MS);
  updateTimeline();
}
document.getElementById('tlPlay').onclick=playTimeline;
document.getElementById('tlRange').oninput=e=>setTlDate(Math.round(+e.target.value));

// ---------------- 研究空白动效：逐行铺开 + 数字滚动 + 空格呼吸 + 扫描光 ----------------
let gapIntroTimer=null;
function gapStopAnim(){
  if(gapIntroTimer){clearInterval(gapIntroTimer);gapIntroTimer=null;}
}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);}
function startGapAnim(){
  gapStopAnim();
  const box=document.getElementById('gap');
  const tbl=box?box.querySelector('table.matrix'):null;
  if(!tbl)return;
  const ease=p=>1-Math.pow(1-p,3);
  const stats=[...box.querySelectorAll('.gapstat b[data-n]')].map(b=>({el:b,n:+b.dataset.n,suf:b.dataset.suf||''}));
  const cards=[...box.querySelectorAll('.gapstat')];
  const ths=[...tbl.querySelectorAll('thead th')];
  const cells=[];
  [...tbl.querySelectorAll('tbody tr')].forEach((tr,ri)=>{
    [...tr.children].forEach((td,ci)=>{
      if(td.classList.contains('rh')){
        cells.push({el:td,ri,type:'rh',v:0,delay:ri*56,dur:430});
      }else{
        const v=+td.dataset.v||0;
        cells.push({el:td,ri,type:v?'hot':'zero',v,delay:ri*56+ci*16,dur:460,
          rgb:v?hex2rgb(gapColor(v)):'',bg:td.style.background||''});
      }
    });
  });
  cards.forEach((c,i)=>{c.style.opacity='0';c.style.transform='translateY(10px)';});
  ths.forEach(t=>{t.style.opacity='0';});
  cells.forEach(c=>{c.el.style.opacity='0';if(c.type==='hot'){c.el.style.background='rgba('+c.rgb+',0)';c.el.textContent='0';}});
  const t0=performance.now();
  const total=Math.max(...cells.map(c=>c.delay+c.dur),1)+140;
  gapIntroTimer=setInterval(()=>{
    const now=performance.now()-t0;
    stats.forEach((s,i)=>{
      const p=Math.min(1,Math.max(0,(now-i*70)/560));
      s.el.textContent=Math.round(s.n*ease(p))+s.suf;
    });
    cards.forEach((c,i)=>{
      const p=ease(Math.min(1,Math.max(0,(now-i*70)/440)));
      c.style.opacity=String(p);c.style.transform='translateY('+(10*(1-p)).toFixed(2)+'px)';
    });
    const pt=ease(Math.min(1,now/320));
    ths.forEach(t=>{t.style.opacity=String(pt);});
    for(const c of cells){
      if(c.done)continue;
      const p=Math.min(1,Math.max(0,(now-c.delay)/c.dur));
      if(p<=0)continue;
      const e=ease(p);
      c.el.style.opacity=String(c.type==='zero'?0.62*e:e);
      if(c.type==='rh'){
        c.el.style.transform='translateX('+(-14*(1-e)).toFixed(2)+'px)';
      }else if(c.type==='hot'){
        c.el.textContent=String(Math.round(c.v*e));
        c.el.style.background='rgba('+c.rgb+','+(0.06+0.94*e).toFixed(3)+')';
      }
      if(p>=1){
        c.done=true;
        if(c.type==='rh'){c.el.style.removeProperty('transform');c.el.style.removeProperty('opacity');}
        else if(c.type==='zero'){c.el.style.removeProperty('opacity');}   // 交回样式表里的固定亮度
        else{c.el.style.background=c.bg;c.el.textContent=String(c.v);}
      }
    }
    if(now>=total){clearInterval(gapIntroTimer);gapIntroTimer=null;}
  },16);
}

// 鼠标移到格子上略微放大突出：用 16ms 插值而不是 CSS transition——嵌入预览里过渡会被冻结
let gapHvEl=null, gapHvS=1, gapHvTimer=null, gapHvOut=true;
function gapHvReset(el){if(!el)return;el.style.transform='';el.style.zIndex='';el.style.boxShadow='';}
function gapHvTick(){
  if(gapHvTimer)return;
  gapHvTimer=setInterval(()=>{
    if(!gapHvEl){clearInterval(gapHvTimer);gapHvTimer=null;return;}
    const t=gapHvOut?1:1.09;
    gapHvS+=(t-gapHvS)*0.38;

}
function bindGapHover(tbl){

    const td=e.target.closest?e.target.closest('td'):null;

  for(const r of c.rows)L.push(r[0]+'｜'+r[1]);

function wrapLines(g,text,maxW){
  const out=[];let cur='';
  for(const ch of String(text)){
    if(g.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch;}else cur+=ch;
  }
  if(cur)out.push(cur);
  return out.length?out:[''];
}
function exportCardPNG(c){
  const Wc=560,P=32;
  const tmp=document.createElement('canvas');tmp.width=Wc*2;tmp.height=2800;
  const g=tmp.getContext('2d');g.scale(2,2);
  g.fillStyle='#f7f2e8';g.fillRect(0,0,Wc,1400);
  g.textBaseline='top';g.textAlign='left';
  let y=26;
  g.font='11px -apple-system,"PingFang SC",sans-serif';g.fillStyle='#8a7b62';
  g.fillText('纯稚研究 · PUREZHI STUDIES',P,y);
  g.textAlign='right';g.fillText(c.code||'',Wc-P,y);g.textAlign='left';
  y+=22;g.strokeStyle='#d8cbb2';g.beginPath();g.moveTo(P,y);g.lineTo(Wc-P,y);g.stroke();y+=18;
  g.font='500 20px "Songti SC","SimSun",serif';g.fillStyle='#22262e';
  for(const l of wrapLines(g,c.title,Wc-P*2)){g.fillText(l,P,y);y+=28;}
  g.font='12px -apple-system,"PingFang SC",sans-serif';g.fillStyle='#8a7b62';
  for(const l of wrapLines(g,c.sub,Wc-P*2)){g.fillText(l,P,y);y+=18;}
  y+=6;
  if(c.big){
    g.font='16px "Songti SC","SimSun",serif';g.fillStyle='#8f332a';
    for(const l of wrapLines(g,c.big,Wc-P*2)){g.fillText(l,P,y);y+=25;}
    y+=4;
  }
  g.strokeStyle='#d8cbb2';g.beginPath();g.moveTo(P,y);g.lineTo(Wc-P,y);g.stroke();y+=12;
  for(const r of c.rows){
    g.font='12px -apple-system,"PingFang SC",sans-serif';g.fillStyle='#8a7b62';g.fillText(r[0],P,y+2);
    g.font='13px "Songti SC","SimSun",serif';
    const ls=String(r[1]).split('\n').flatMap(x=>wrapLines(g,x,Wc-P*2-84));
    g.fillStyle='#22262e';
    for(const l of ls){g.fillText(l,P+84,y+2);y+=21;}
    y+=9;
    g.strokeStyle='#e6dcc7';g.beginPath();g.moveTo(P,y-5);g.lineTo(Wc-P,y-5);g.stroke();
  }
  if(c.stamp){g.textAlign='right';g.font='13px "Songti SC",serif';g.fillStyle='#b23b2e';g.fillText('［'+c.stamp+'］',Wc-P,y+4);g.textAlign='left';y+=26;}
  y+=10;g.strokeStyle='#d8cbb2';g.beginPath();g.moveTo(P,y);g.lineTo(Wc-P,y);g.stroke();y+=12;
  g.font='11px -apple-system,"PingFang SC",sans-serif';g.fillStyle='#8a7b62';
  for(const fl of c.foot.split('\n'))for(const l of wrapLines(g,fl,Wc-P*2)){g.fillText(l,P,y);y+=18;}
  const Hc=Math.ceil(y+24);
  const out=document.createElement('canvas');out.width=Wc*2;out.height=Hc*2;
  const o=out.getContext('2d');o.drawImage(tmp,0,0,Wc*2,Hc*2,0,0,Wc*2,Hc*2);
  o.strokeStyle='#ded3bc';o.lineWidth=2;o.strokeRect(1,1,Wc*2-2,Hc*2-2);
  const a=document.createElement('a');a.download='纯稚研究-'+(c.code||'card')+'.png';a.href=out.toDataURL('image/png');a.click();
}

  document.getElementById('ringBtn').style.display=(v==='timeline')?'block':'none';
  if(v==='timeline')syncTlH();                           // 播放条刚显形：先量一次真实高度，浮标据此让位
  // 分视图栏位：语料总览只留右栏（语料索引）；发展历程、研究空白左右栏都收起，让画面整幅展开
  document.getElementById('side').style.display=(view==='overview')?'':'none';
  document.getElementById('detail').style.display=(view==='overview'||view==='corpus')?'':'none';
  document.getElementById('hint').textContent=(v==='corpus')
    ? '12 处原始语料 · 一帖连多处语料即成为桥 · 滚轮缩放 / 拖拽平移'
    : '滚轮缩放 · 拖拽平移 · 点击节点点亮关联（悬停关联节点看关系）· 拖动可固定';
  if(v==='corpus'){                                      // 语料总览只画语料与帖：这两层始终打开，避免只剩空画布
    let dirty=false;
    for(const k of ['corpus','post']) if(!layers[k]){layers[k]=true;dirty=true;}
    if(dirty){renderLayers();renderDetail();}
  }
  if(isGap){renderGap();document.getElementById('loading').style.display='none';window.scrollTo(0,0);}
  else {
    gapStopAnim();                                       // 离开矩阵就停掉它的定时器，别在后台空转
    resize();                                            // 左右栏显隐会改变画布尺寸：先重新测量，避免位图被拉伸/布局用旧宽高
    tx=0;ty=0;scale=1;buildView();
    if(v==='corpus'&&selected&&!VN.some(n=>n.id===selected)) selected=null;  // 选中项不在总览里就退回名录
    if(v==='timeline'){
      // 进入即自动播放：从第一天长起，入场生长完成后自动逐日推进
      tlDate=TL_DATES[0];
      renderTimelineBar();
      fitTimelineView();
      // 入场生长完成后再自动播放；当日节点很少时不必等满四波，尽快起播
      const todayN=VN.filter(n=>(NODE_FIRST.get(n.id)||'')===tlDate).length;
      const waitMs=todayN<24?1000:(GROW_MS+GROW_STAGE_MAX+GROW_SWEEP+420);
      tlAutoTimer=setTimeout(()=>{tlAutoTimer=null;if(view==='timeline'&&!tlPlaying)playTimeline();},waitMs);
    }
  }
  renderSide();
  renderDetail();                                        // 右栏随视图换内容：语料总览给语料名录，其余给统计摘要
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.v));
// ---------------- 搜索：点放大镜浮出固定检索条，回车／再点放大镜把结果送进右栏 ----------------
let searchOn=false, searchHits=[];                        // searchOn=右栏正在展示检索结果（不是节点详情）
let camSaved=null;                                       // 为看某条结果平移过的机位，返回检索结果时复位
function searchScore(n,q){                               // 名称命中权重最高，其次是释义/作者/学科等字段
  const label=(n.label||'').toLowerCase();
  if(label===q)return 100;
  if(label.startsWith(q))return 80;
  if(label.includes(q))return 60;
  const other=[n.sub,n.author,n.source,n.canonRef,n.classReason,n.canonKind,n.credit,
    (n.variants||[]).join(' '),(n.discRaw||[]).map(discLabel).join(' ')].join(' ').toLowerCase();
  if(other.includes(q))return 32;
  if((n.summary||'').toLowerCase().includes(q))return 22;   // 正文/释义里提到：排在名字命中之后
  return (n.gloss||'').toLowerCase().includes(q)?14:0;
}
function snip(t,kw,len){                                  // 正文命中时给一行上下文，说明为什么它被搜出来
  const s=String(t||''), i=s.toLowerCase().indexOf(kw.toLowerCase());
  if(i<0)return '';
  const a=Math.max(0,i-len), b=Math.min(s.length,i+kw.length+len);
  return (a>0?'…':'')+esc(s.slice(a,i))+'<em class="hl">'+esc(s.slice(i,i+kw.length))+'</em>'+
    esc(s.slice(i+kw.length,b))+(b<s.length?'…':'');
}
function hlText(t,kw){                                    // 命中片段高亮：先转义再包一层，避免注入
  const s=esc(t||'');
  if(!kw)return s;
  const i=s.toLowerCase().indexOf(kw.toLowerCase());
  if(i<0)return s;
  return s.slice(0,i)+'<em class="hl">'+s.slice(i,i+kw.length)+'</em>'+s.slice(i+kw.length);
}
function lockLayout(){                                   // 检索即定稿：速度清零、力导向停摆，节点与边原地不动
  if(view==='timeline')return;                            // 发展历程还在按日生长，位置交给它自己收敛
  layoutLocked=true; simOn=false; alpha=0.004;
  for(const n of VN){n.vx=0;n.vy=0;}
}
function resetSearchState(){
  query='';searchOn=false;searchHits=[];camSaved=null;
  const inp=document.getElementById('q'),box=document.getElementById('sbox'),btn=document.getElementById('searchBtn');
  if(inp)inp.value='';
  if(box)box.classList.remove('on');
  if(btn)btn.classList.remove('on');
}
function showDetailPane(){                               // 发展历程平时收起右栏；要放检索结果时临时撑开
  const d=document.getElementById('detail');
  if(d.style.display==='none'){
    d.style.display='';
    if(view!=='gap'){resize();if(view==='timeline')fitTimelineView();else draw();}
  }
}
function clearSearch(){
  resetSearchState();
  clearTimeout(lockTimer);
  const d=document.getElementById('detail');
  d.style.display=(view==='overview'||view==='corpus')?'':'none';   // 收回刚为结果撑开的右栏
  if(camSaved){tx=camSaved.tx;ty=camSaved.ty;camSaved=null;}         // 机位回到检索时的位置
  if(view!=='gap'){resize();if(view==='timeline')fitTimelineView();else draw();}
  renderDetail();
}
function runSearch(raw){
  const inp=document.getElementById('q');
  const kw=String(raw!=null?raw:inp.value).trim();
  if(!kw){clearSearch();return;}
  // 检索结果统一落在引文总览（正常路径：点放大镜时就已经切过去了，这里只是兜底）
  if(view!=='overview')switchView('overview');
  inp.value=kw;                                          // 切视图可能清空输入框，这里补回
  query=kw;selected=null;
  const q=kw.toLowerCase(), ord={theory:0,canon:1,corpus:2,post:3};
  searchHits=D.nodes.map((n,i)=>({n,s:searchScore(n,q),i})).filter(x=>x.s>0)
    .sort((a,b)=>b.s-a.s||(ord[a.n.type]-ord[b.n.type])||a.i-b.i)  // 同分按类型聚拢，同类保持原始顺序
    .map(x=>x.n);
  searchOn=true;
  // 检索后画面定住：看结果时图不再自己挪。布局若还在铺开中，先让它铺完再定，免得冻成一坨
  clearTimeout(lockTimer);
  if(alpha>0.35)lockTimer=setTimeout(lockLayout,760);
  else lockLayout();
  showDetailPane();
  renderDetail();
  draw();
}
function resultSub(n){
  if(n.type==='post')return esc(n.author||'')+' · '+esc(n.date||'');
  if(n.type==='theory')return esc(discLabel((n.discRaw||[])[0]))+' · 网友自造 · '+(n.post_count||0)+' 篇调用';
  if(n.type==='canon')return esc(n.canonKind||'原典')+' · '+(n.citeCount||0)+' 篇调用';
  if(n.type==='corpus')return esc(n.sub||'语料')+' · '+(n._cnt||0)+' 篇取材';
  return '';
}
function resultItem(n,kw){
  const inLabel=(n.label||'').toLowerCase().includes(kw.toLowerCase());
  const ex=inLabel?'':snip(n.summary||n.gloss||'',kw,26);
  return '<div class="item" data-go="'+esc(n.id)+'">'+hlText(n.label,kw)+
    '<div class="sub"><i class="dot" style="background:'+nodeColor(n)+'"></i>'+resultSub(n)+'</div>'+
    (ex?'<div class="snip">'+ex+'</div>':'')+'</div>';
}
function searchResultsHTML(){
  const kw=query.trim();
  const groups={theory:[],canon:[],corpus:[],post:[]};
  for(const n of searchHits)(groups[n.type]||(groups[n.type]=[])).push(n);
  let h='<div class="sres"><h2>检索「'+esc(kw)+'」</h2>'+
    '<div class="sres-n">命中 <b>'+searchHits.length+'</b> 个节点 · 点条目在图上定位</div>';
  if(!searchHits.length){
    h+='<div class="empty">没有找到相关节点。<br>可以换成更短的关键词，或用作者名、原典名的片段再试。</div>'+
       '<div class="btnrow"><button data-sclear="1">清除检索</button></div></div>';
    return h;
  }
  h+='<div class="relrow">'+['theory','canon','corpus','post'].filter(t=>groups[t].length).map(t=>
    '<span class="reltag" style="color:'+nodeColor({type:t})+';border-color:'+nodeColor({type:t})+'66">'+
    TYPE[t].label+' '+groups[t].length+'</span>').join('')+'</div>';
  const LIM={theory:10,canon:8,corpus:12,post:12};
  for(const t of ['theory','canon','corpus','post']){
    const arr=groups[t]; if(!arr.length)continue;
    h+='<div class="sec-t">'+TYPE[t].label+' · '+arr.length+'</div>';
    for(const n of arr.slice(0,LIM[t]))h+=resultItem(n,kw);
    if(arr.length>LIM[t])h+='<div class="empty">另有 '+(arr.length-LIM[t])+' 条，加长关键词可缩小范围。</div>';
  }
  h+='<div class="btnrow"><button data-sclear="1">清除检索</button></div></div>';
  return h;
}
(function initSearch(){
  const btn=document.getElementById('searchBtn'), inp=document.getElementById('q'),
        box=document.getElementById('sbox'), sx=document.getElementById('sx');
  if(!btn||!inp||!box)return;
  const openBox=()=>{
    if(view!=='overview')switchView('overview');          // 检索一律在引文总览里做：开框先切过去，用户敲字的这几秒布局自己铺开
    syncTopH();box.classList.add('on');btn.classList.add('on');setTimeout(()=>{inp.focus();inp.select();},40);   // 顶部栏换行后高度会变，开框前重新量一次，免得压住图层按钮
  };
  const closeBox=()=>{box.classList.remove('on');btn.classList.remove('on');inp.blur();};
  btn.onclick=e=>{
    e.stopPropagation();
    if(!box.classList.contains('on')){openBox();return;}
    if(inp.value.trim())runSearch();                      // 再点一次放大镜＝执行检索
    else closeBox();
  };
  const dismiss=()=>{if(searchOn){clearSearch();}else{closeBox();inp.value='';}};   // 收起时把输入也清干净
  if(sx)sx.onclick=e=>{e.stopPropagation();dismiss();};
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();if(inp.value.trim())runSearch();else dismiss();}
    else if(e.key==='Escape'){e.preventDefault();dismiss();}
  });
  inp.addEventListener('input',()=>{if(!inp.value.trim()&&searchOn)clearSearch();});
  // 检索条是固定悬浮的，点别处不收起；关闭走 × 或 Esc
})();
document.getElementById('reset').onclick=()=>{resetSearchState();discFilter=null;for(const k in layers)layers[k]=true;selected=null;hovered=null;tx=0;ty=0;scale=1;stopTimeline();tlDate=TL_DATES[TL_DATES.length-1];tlPos=TL_DATES.length-1;renderLayers();renderSide();renderDetail();switchView(view);};
const VNAME={overview:'引文总览',timeline:'发展历程',corpus:'语料总览',gap:'研究空白'};

// ---------------- 关系图例（画布左下角小浮标，点按弹出） ----------------
(function initRelLegend(){
  const pop=document.getElementById('relPop'), btn=document.getElementById('legendBtn');
  if(!pop||!btn)return;
  pop.innerHTML='<div class="rh">边上箭头 = 关系指向 · 点空白处关闭</div>'+
    Object.keys(REL).map(k=>{
      const r=REL[k];
      return '<div class="rrow"><i class="'+(r.arrow?'':'nodir')+'" style="color:'+r.color+';border-top-color:'+r.color+'"></i>'+
        '<b>'+r.label+'</b><span>'+r.desc+'</span></div>';
    }).join('');
  btn.onclick=e=>{e.stopPropagation();pop.classList.toggle('on');btn.classList.toggle('on',pop.classList.contains('on'));};
  document.addEventListener('click',e=>{
    if(!pop.classList.contains('on'))return;
    if(pop.contains(e.target)||e.target===btn)return;
    pop.classList.remove('on');btn.classList.remove('on');
  });
})();
function closeLegend(){ // 切换视图时收起两个图例浮层
  for(const id of ['relPop','ringPop']){const p=document.getElementById(id);if(p)p.classList.remove('on');}
  for(const id of ['legendBtn','ringBtn']){const b=document.getElementById(id);if(b)b.classList.remove('on');}
}

// ---------------- 图层图例（发展历程左下角，替代画布上的环标签） ----------------
(function initRingLegend(){
  const pop=document.getElementById('ringPop'), btn=document.getElementById('ringBtn');
  if(!pop||!btn)return;
  const cnt=t=>D.nodes.filter(n=>n.type===t).length;
  const hubN=D.nodes.filter(n=>n.type==='canon'&&n.hub).length;
  const oneN=D.nodes.filter(n=>n.type==='canon'&&!n.hub).length;
  const rows=[
    ['ring big','#ffab2e','理论原典 · 高频','反复调用 · '+hubN+' 部'],
    ['ring faint','#ffab2e','理论原典 · 单次','只提一次 · '+oneN+' 部'],
    ['ring','#ff5f9e','原始语料','名场面 · '+cnt('corpus')+' 处'],
    ['ring','#2fd8a4','二创概念','自造 · '+cnt('theory')+' 个'],
    ['ring','#5da9ff','二创分析','帖子 · '+cnt('post')+' 篇']
  ];
  pop.innerHTML='<div class="rh">五层环由内向外 · 点空白处关闭</div>'+rows.map(r=>
    '<div class="rrow"><i class="'+r[0]+'" style="color:'+r[1]+'"></i><b>'+r[2]+'</b><span>'+r[3]+'</span></div>').join('');
  btn.onclick=e=>{e.stopPropagation();pop.classList.toggle('on');btn.classList.toggle('on',pop.classList.contains('on'));};
  document.addEventListener('click',e=>{
    if(!pop.classList.contains('on'))return;
    if(pop.contains(e.target)||e.target===btn)return;
    pop.classList.remove('on');btn.classList.remove('on');
  });
})();

// ---------------- boot ----------------
function syncTopH(){
  const tb=document.getElementById('topbar');
  if(tb)document.documentElement.style.setProperty('--topH',tb.offsetHeight+'px');
}
syncTopH();resize();renderHeader();renderLayers();renderSide();renderDetail();
// 顶栏高度会随字体加载/窗口变窄而换行变化：持续同步 --topH，检索条与表格表头都靠它定位
if(window.ResizeObserver){new ResizeObserver(()=>syncTopH()).observe(document.getElementById('topbar'));}
else window.addEventListener('load',syncTopH);
const urlP=new URLSearchParams(location.search);
const urlV=urlP.get('view'), urlSel=urlP.get('sel'), urlD=urlP.get('date');
switchView((urlV==='gap'||VIEW_CFG[urlV])?urlV:'timeline');   // 无参数进入时落在主界面：发展历程
if(urlD&&TL_DATES.includes(urlD)){tlDate=urlD;if(view==='timeline')renderTimelineBar();}
if(urlSel&&N.has(urlSel)) setTimeout(()=>selectNode(urlSel),900);
const urlCard=urlP.get('card');
if(urlCard&&N.has(urlCard))setTimeout(()=>chainCard(urlCard),700);
if(urlP.get('call')==='1'&&GAP_ZERO.length)setTimeout(()=>{
  const cold=byType.corpus.slice().sort((a,b)=>(a._cnt||0)-(b._cnt||0))[0];
  const z=GAP_ZERO.find(x=>x.c.id===cold.id)||GAP_ZERO[0];
  openCall(z.c,z.d);
},700);
let last=0;
function loop(t){
  // 历程视图的生长动画由 16ms 定时器驱动（rAF 在嵌入预览/后台标签常被节流，会导致节点整批突然出现）
  const driven=view==='timeline'&&(growTimer||tlPlaying);
  if(view!=='gap'){step();if(!driven&&t-last>33){draw();last=t;}}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
